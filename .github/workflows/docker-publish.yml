# Publica la imagen de la API en Docker Hub cuando se crea un tag de versión.
#
#   git tag v0.4.0 && git push origin v0.4.0
#
# El tag de Git, la versión de package.json y el tag de la imagen deben
# coincidir: si no, el workflow falla antes de publicar nada.
#
# Requiere en GitHub (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  usuario de Docker Hub
#   DOCKERHUB_TOKEN     Access Token de Docker Hub (Account settings > Personal access tokens)
name: Publicar imagen en Docker Hub

on:
  push:
    tags: ['v*.*.*']

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leeconnos
          POSTGRES_PASSWORD: leeconnos
          POSTGRES_DB: leeconnos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leeconnos" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://leeconnos:leeconnos@localhost:5432/leeconnos
      JWT_SECRET: secreto-de-integracion-continua-solo-para-pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verificar que el tag coincide con package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con package.json (v$VERSION)"; exit 1
          fi
      - run: npm ci
      - run: npm run build
      # Las migraciones preparan la base al iniciar la app dentro de las pruebas.
      - run: npm run test:e2e

  publicar:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 para el servidor (EC2) y arm64 para quien pruebe en Mac/ARM.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/leeconnos-backend:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/leeconnos-backend:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
