# API + PostgreSQL en el servidor. La API NO se construye aquí: se descarga la
# imagen publicada en Docker Hub con la versión indicada en API_VERSION (.env).
#
#   Primera vez:      docker compose up -d
#   Cambiar versión:  editar API_VERSION en .env y
#                     docker compose pull api && docker compose up -d api
#
# Para construir la imagen desde el código (desarrollo), sumar el override:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leeconnos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leeconnos}
      POSTGRES_DB: ${POSTGRES_DB:-leeconnos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # La base solo se publica en localhost del servidor, nunca hacia internet.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-leeconnos} -d ${POSTGRES_DB:-leeconnos}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # La estructura y los datos de prueba los crean las migraciones de TypeORM
    # al arrancar la API (DB_MIGRAR_AL_INICIAR=true), no scripts manuales.
    image: ${DOCKERHUB_USUARIO:?Falta DOCKERHUB_USUARIO en .env}/leeconnos-backend:${API_VERSION:?Falta API_VERSION en .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Dentro de la red de compose la base se llama "db".
      DATABASE_URL: postgresql://${POSTGRES_USER:-leeconnos}:${POSTGRES_PASSWORD:-leeconnos}@db:5432/${POSTGRES_DB:-leeconnos}
      DB_SSL: 'false'
      UPLOADS_DIR: /app/uploads
    volumes:
      # Las imágenes subidas sobreviven a cada cambio de versión.
      - uploads:/app/uploads
    ports:
      - '${PORT:-3000}:${PORT:-3000}'

  # HTTPS: docker compose --profile https up -d
  # Caddy obtiene y renueva solo el certificado de Let's Encrypt para DOMINIO
  # (necesita los puertos 80 y 443 abiertos en el servidor). Requerido para que
  # el navegador acepte las cookies de sesión entre dominios (SameSite=None; Secure).
  https:
    image: caddy:2.8.4-alpine
    profiles: ['https']
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMINIO: ${DOMINIO:-localhost}
      API_PORT: ${PORT:-3000}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
